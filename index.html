<style>
:root {
  --bg:#0A0A14;
  --fg:#F0EDE8;
  --muted:#8585A3;
  --accent:#F97316;
  --teal:#0D9488;
  --card:rgba(26,26,46,.72);
  --border:rgba(255,255,255,.1);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"DM Sans",sans-serif;background:var(--bg);color:var(--fg);min-height:100vh;overflow-x:hidden}
h1,h2,h3{font-family:"Space Grotesk",sans-serif}
button{font-family:inherit}
.mesh-bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 18% 20%,rgba(249,115,22,.14),transparent 34%),radial-gradient(circle at 84% 74%,rgba(13,148,136,.13),transparent 35%),var(--bg)}
.gc{background:var(--card);backdrop-filter:blur(18px);border:1px solid var(--border);border-radius:16px}
.fi{width:100%;padding:12px 15px;border-radius:10px;border:1px solid var(--border);background:rgba(15,15,26,.9);color:var(--fg);outline:none}
.fi:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(249,115,22,.18)}
.btn-p,.btn-s{padding:12px 24px;border-radius:10px;font-weight:700;cursor:pointer;transition:.2s}
.btn-p{border:0;color:white;background:linear-gradient(135deg,#F97316,#EA580C)}
.btn-p:hover{transform:translateY(-1px)}
.btn-p:disabled{opacity:.55;cursor:not-allowed;transform:none}
.btn-s{border:1px solid var(--border);color:var(--fg);background:transparent}
.btn-s:hover{border-color:var(--teal);color:#2DD4BF;background:rgba(13,148,136,.1)}
.nav-link{padding:8px 13px;border-radius:8px;color:var(--muted);background:none;border:0;cursor:pointer;font-weight:600}
.nav-link:hover,.nav-link.active{background:rgba(255,255,255,.06);color:var(--fg)}
.nav-link.active{color:var(--accent)}
.skill-tag{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;background:rgba(249,115,22,.14);border:1px solid rgba(249,115,22,.3);color:#FDBA74;font-size:13px}
.skill-tag button{background:none;border:0;color:#FDBA74;cursor:pointer}
.spinner{width:38px;height:38px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.view-in{animation:viewIn .35s ease both}
@keyframes viewIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
#toast-container{position:fixed;top:18px;right:18px;z-index:9999;display:flex;flex-direction:column;gap:10px}
.toast{padding:13px 16px;border-radius:12px;background:rgba(15,15,26,.95);border:1px solid var(--border);max-width:360px}
.toast-success{color:#2DD4BF}.toast-error{color:#FCA5A5}.toast-info{color:#FDBA74}
.online-dot{width:10px;height:10px;border-radius:50%;background:#22C55E;border:2px solid #1A1A2E;position:absolute;right:1px;bottom:1px}
.chat-bub{max-width:75%;padding:10px 15px;border-radius:16px;font-size:14px;line-height:1.45;word-break:break-word}
.chat-bub-s{margin-left:auto;color:white;background:linear-gradient(135deg,#F97316,#EA580C);border-bottom-right-radius:5px}
.chat-bub-r{background:rgba(255,255,255,.08);border-bottom-left-radius:5px}
.status-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:#2DD4BF;background:rgba(13,148,136,.14);border-radius:999px;padding:3px 8px}
@media(max-width:768px){.chat-layout{flex-direction:column}.chat-side{width:100%!important;max-height:190px;border-right:0!important;border-bottom:1px solid var(--border)}}
</style>
</head>

<body>
<div class="mesh-bg"></div>
<div id="toast-container"></div>
<div id="app"></div>

<script>
const fbConfig = {
  apiKey: "AIzaSyC44oGmg6wjvRo_Cbo3zVlMGC2BgQ8PnAU",
  authDomain: "skill-mates.firebaseapp.com",
  projectId: "skill-mates",
  storageBucket: "skill-mates.firebasestorage.app",
  messagingSenderId: "115839981108",
  appId: "1:115839981108:web:a7b3bbe35d07e037c8dc61"
};

let db = null;
let auth = null;

const S = {
  user: null,
  profile: null,
  users: [],
  convId: null,
  chatUnsub: null,
  presenceInterval: null
};

function esc(value) {
  const d = document.createElement("div");
  d.textContent = value == null ? "" : String(value);
  return d.innerHTML;
}

function getConvId(a, b) {
  return a < b ? a + "_" + b : b + "_" + a;
}

function toast(msg, type = "info") {
  const box = document.getElementById("toast-container");
  const div = document.createElement("div");
  div.className = "toast toast-" + type;
  div.innerHTML = `<i class="fa-solid fa-circle-info"></i> ${esc(msg)}`;
  box.appendChild(div);
  setTimeout(() => div.remove(), 3500);
}

function cleanupListeners() {
  if (S.chatUnsub) {
    S.chatUnsub();
    S.chatUnsub = null;
  }
}

function navBar(active = "") {
  if (!S.user) return "";
  return `
    <nav class="fixed top-0 left-0 right-0 z-50 bg-dark-900/85 backdrop-blur-xl border-b border-white/5">
      <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
        <button class="flex items-center gap-2" onclick="go('dashboard')">
          <span class="w-9 h-9 rounded-lg bg-gradient-to-br from-brand-500 to-teal-600 flex items-center justify-center">
            <i class="fa-solid fa-handshake text-white"></i>
          </span>
          <span class="font-display font-bold hidden sm:inline">Skill Mates</span>
        </button>
        <div class="flex items-center gap-1">
          <button class="nav-link ${active === "dashboard" ? "active" : ""}" onclick="go('dashboard')"><i class="fa-solid fa-house"></i> <span class="hidden sm:inline">Dashboard</span></button>
          <button class="nav-link ${active === "explore" ? "active" : ""}" onclick="go('explore')"><i class="fa-solid fa-compass"></i> <span class="hidden sm:inline">Explore</span></button>
          <button class="nav-link ${active === "chat" ? "active" : ""}" onclick="go('chat')"><i class="fa-solid fa-comments"></i> <span class="hidden sm:inline">Chat</span></button>
          <button class="nav-link ${active === "profile" ? "active" : ""}" onclick="go('editprofile')"><i class="fa-solid fa-user"></i> <span class="hidden sm:inline">Profile</span></button>
        </div>
        <button class="nav-link text-red-300" onclick="handleLogout()"><i class="fa-solid fa-right-from-bracket"></i></button>
      </div>
    </nav>`;
}

function renderLanding() {
  cleanupListeners();
  document.getElementById("app").innerHTML = `
    <main class="min-h-screen flex items-center justify-center px-4 py-16 view-in">
      <section class="text-center max-w-5xl">
        <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-gradient-to-br from-brand-500 to-teal-600 mb-6">
          <i class="fa-solid fa-handshake text-white text-3xl"></i>
        </div>
        <h1 class="font-display text-5xl sm:text-7xl font-bold mb-5">
          Skill <span class="bg-gradient-to-r from-brand-400 to-teal-400 bg-clip-text text-transparent">Mates</span>
        </h1>
        <p class="text-lg sm:text-xl max-w-2xl mx-auto mb-8" style="color:var(--muted)">
          Connect with peers, discover skills, and chat in real time.
        </p>
        <div class="flex justify-center gap-4 mb-12">
          <button class="btn-p" onclick="go('register')">Get Started</button>
          <button class="btn-s" onclick="go('login')">Sign In</button>
        </div>
        <div class="grid sm:grid-cols-3 gap-4 text-left">
          <div class="gc p-5"><i class="fa-solid fa-bolt text-brand-400 text-xl mb-3"></i><h3 class="font-display font-bold mb-1">Real-Time Discovery</h3><p class="text-sm" style="color:var(--muted)">Find people and skills as profiles update.</p></div>
          <div class="gc p-5"><i class="fa-solid fa-comments text-brand-400 text-xl mb-3"></i><h3 class="font-display font-bold mb-1">Direct Chat</h3><p class="text-sm" style="color:var(--muted)">Send and receive readable messages instantly.</p></div>
          <div class="gc p-5"><i class="fa-solid fa-arrows-rotate text-brand-400 text-xl mb-3"></i><h3 class="font-display font-bold mb-1">Skill Exchange</h3><p class="text-sm" style="color:var(--muted)">Teach what you know and learn what you need.</p></div>
        </div>
      </section>
    </main>`;
}

function renderLogin() {
  cleanupListeners();
  document.getElementById("app").innerHTML = `
    <main class="min-h-screen flex items-center justify-center p-4 view-in">
      <section class="gc p-8 max-w-md w-full">
        <button class="text-sm mb-6" style="color:var(--muted)" onclick="go('landing')"><i class="fa-solid fa-arrow-left"></i> Back</button>
        <h2 class="font-display text-3xl font-bold mb-1">Welcome Back</h2>
        <p class="text-sm mb-6" style="color:var(--muted)">Sign in to your account</p>
        <form id="login-form" class="space-y-4">
          <input class="fi" id="l-email" type="email" required placeholder="Email" />
          <input class="fi" id="l-pass" type="password" required placeholder="Password" />
          <button type="button" class="text-sm text-brand-400" onclick="handleForgot()">Forgot password?</button>
          <button class="btn-p w-full" id="l-btn">Sign In</button>
        </form>
        <p class="text-center text-sm mt-6" style="color:var(--muted)">No account? <button class="text-teal-400 font-bold" onclick="go('register')">Register</button></p>
      </section>
    </main>`;
  document.getElementById("login-form").addEventListener("submit", handleLogin);
}

function renderRegister() {
  cleanupListeners();
  document.getElementById("app").innerHTML = `
    <main class="min-h-screen flex items-center justify-center p-4 view-in">
      <section class="gc p-8 max-w-md w-full">
        <button class="text-sm mb-6" style="color:var(--muted)" onclick="go('landing')"><i class="fa-solid fa-arrow-left"></i> Back</button>
        <h2 class="font-display text-3xl font-bold mb-1">Create Account</h2>
        <p class="text-sm mb-6" style="color:var(--muted)">Join Skill Mates</p>
        <form id="reg-form" class="space-y-4">
          <input class="fi" id="r-name" required placeholder="Full name" />
          <input class="fi" id="r-email" type="email" required placeholder="Email" />
          <input class="fi" id="r-pass" type="password" required minlength="6" placeholder="Password" />
          <div class="grid grid-cols-2 gap-3">
            <input class="fi" id="r-age" type="number" min="13" max="120" required placeholder="Age" />
            <input class="fi" id="r-inst" required placeholder="Institution" />
          </div>
          <input class="fi" id="r-addr" required placeholder="Address" />
          <input class="fi" id="r-skill-input" placeholder="Type skill and press Enter" />
          <div id="r-skills" class="flex flex-wrap gap-2"></div>
          <button class="btn-p w-full" id="r-btn">Create Account</button>
        </form>
        <p class="text-center text-sm mt-6" style="color:var(--muted)">Have an account? <button class="text-teal-400 font-bold" onclick="go('login')">Sign In</button></p>
      </section>
    </main>`;

  const skills = [];
  const input = document.getElementById("r-skill-input");
  const holder = document.getElementById("r-skills");

  function drawSkills() {
    holder.innerHTML = skills.map((s, i) => `<span class="skill-tag">${esc(s)} <button type="button" onclick="window._removeRegSkill(${i})">&times;</button></span>`).join("");
  }

  window._removeRegSkill = i => {
    skills.splice(i, 1);
    drawSkills();
  };

  window._regSkills = () => skills;

  input.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === ",") {
      e.preventDefault();
      const skill = input.value.replace(",", "").trim().toLowerCase();
      if (skill && !skills.includes(skill)) skills.push(skill);
      input.value = "";
      drawSkills();
    }
  });

  document.getElementById("reg-form").addEventListener("submit", handleRegister);
}

function renderDashboard() {
  cleanupListeners();
  const p = S.profile || {};
  document.getElementById("app").innerHTML = `
    ${navBar("dashboard")}
    <main class="pt-24 pb-12 px-4 max-w-6xl mx-auto view-in">
      <h1 class="font-display text-4xl font-bold mb-2">Welcome back, <span class="text-brand-400">${esc(p.name || "User")}</span></h1>
      <p class="mb-8" style="color:var(--muted)">Here is what is happening on Skill Mates.</p>

      <div class="grid sm:grid-cols-3 gap-4 mb-8">
        <div class="gc p-5"><p class="text-sm" style="color:var(--muted)">Total Users</p><div class="font-display text-3xl font-bold" id="stat-users">--</div></div>
        <div class="gc p-5"><p class="text-sm" style="color:var(--muted)">Online Now</p><div class="font-display text-3xl font-bold" id="stat-online">--</div></div>
        <div class="gc p-5"><p class="text-sm" style="color:var(--muted)">Your Skills</p><div class="font-display text-3xl font-bold">${(p.skills || []).length}</div></div>
      </div>

      <div class="grid lg:grid-cols-2 gap-6">
        <section class="gc p-6">
          <h3 class="font-display font-bold mb-4">Your Skills</h3>
          <div class="flex flex-wrap gap-2">${(p.skills || []).map(s => `<span class="skill-tag">${esc(s)}</span>`).join("") || `<p style="color:var(--muted)">No skills yet.</p>`}</div>
          <button class="btn-s mt-4" onclick="go('editprofile')">Edit Profile</button>
        </section>
        <section class="gc p-6">
          <h3 class="font-display font-bold mb-4">Quick Actions</h3>
          <div class="grid gap-3">
            <button class="gc p-4 text-left" onclick="go('explore')"><b>Explore Skills</b><br><span class="text-sm" style="color:var(--muted)">Find people to learn from.</span></button>
            <button class="gc p-4 text-left" onclick="go('chat')"><b>Open Chat</b><br><span class="text-sm" style="color:var(--muted)">Continue conversations.</span></button>
          </div>
        </section>
      </div>

      <section class="gc p-6 mt-6">
        <h3 class="font-display font-bold mb-4">Recently Joined</h3>
        <div id="recent-users" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-3"><div class="spinner"></div></div>
      </section>
    </main>`;

  db.collection("users").onSnapshot(snap => {
    const users = [];
    snap.forEach(d => users.push({ id: d.id, ...d.data() }));

    document.getElementById("stat-users").textContent = users.length;
    document.getElementById("stat-online").textContent = users.filter(u => u.lastSeen && Date.now() - u.lastSeen < 120000).length;

    const recent = users.filter(u => u.id !== S.user.uid).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)).slice(0, 6);
    const box = document.getElementById("recent-users");
    box.innerHTML = recent.length ? recent.map(userCard).join("") : `<p class="text-sm" style="color:var(--muted)">No other users yet.</p>`;
  });
}

function userCard(u) {
  const online = u.lastSeen && Date.now() - u.lastSeen < 120000;
  return `
    <button class="gc p-4 text-left hover:border-brand-500/40" onclick="go('profile:${u.id}')">
      <div class="flex items-center gap-3">
        <div class="relative">
          <div class="w-11 h-11 rounded-full bg-gradient-to-br from-brand-500 to-teal-600 flex items-center justify-center font-bold">${esc((u.name || "U")[0]).toUpperCase()}</div>
          ${online ? `<span class="online-dot"></span>` : ""}
        </div>
        <div class="min-w-0">
          <div class="font-bold truncate">${esc(u.name || "User")}</div>
          <div class="text-xs truncate" style="color:var(--muted)">${esc((u.skills || []).slice(0, 2).join(", ") || "No skills")}</div>
        </div>
      </div>
    </button>`;
}

function renderExplore() {
  cleanupListeners();
  document.getElementById("app").innerHTML = `
    ${navBar("explore")}
    <main class="pt-24 pb-12 px-4 max-w-6xl mx-auto view-in">
      <h1 class="font-display text-4xl font-bold mb-2">Explore Skills</h1>
      <p class="mb-6" style="color:var(--muted)">Discover peers and their expertise.</p>
      <input class="fi max-w-md mb-6" id="explore-search" placeholder="Search by name or skill..." />
      <div id="explore-grid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4"><div class="spinner"></div></div>
    </main>`;

  db.collection("users").onSnapshot(snap => {
    S.users = [];
    snap.forEach(d => {
      if (d.id !== S.user.uid) S.users.push({ id: d.id, ...d.data() });
    });
    drawExplore(S.users);
  });

  document.getElementById("explore-search").addEventListener("input", e => {
    const q = e.target.value.toLowerCase();
    drawExplore(S.users.filter(u =>
      (u.name || "").toLowerCase().includes(q) ||
      (u.skills || []).some(s => s.toLowerCase().includes(q))
    ));
  });
}

function drawExplore(users) {
  const box = document.getElementById("explore-grid");
  box.innerHTML = users.length ? users.map(userCard).join("") : `<p style="color:var(--muted)">No users found.</p>`;
}

async function renderUserProfile(uid) {
  cleanupListeners();
  document.getElementById("app").innerHTML = `
    ${navBar("")}
    <main class="pt-24 pb-12 px-4 max-w-2xl mx-auto view-in">
      <button class="mb-6 text-sm" style="color:var(--muted)" onclick="go('explore')"><i class="fa-solid fa-arrow-left"></i> Back</button>
      <div id="profile-box" class="flex justify-center py-12"><div class="spinner"></div></div>
    </main>`;

  const doc = await db.collection("users").doc(uid).get();
  if (!doc.exists) {
    document.getElementById("profile-box").innerHTML = `<p>User not found.</p>`;
    return;
  }

  const u = { id: doc.id, ...doc.data() };
  const online = u.lastSeen && Date.now() - u.lastSeen < 120000;

  document.getElementById("profile-box").innerHTML = `
    <section class="gc p-7 w-full">
      <div class="flex items-center gap-4 mb-6">
        <div class="relative">
          <div class="w-20 h-20 rounded-full bg-gradient-to-br from-brand-500 to-teal-600 flex items-center justify-center text-2xl font-bold">${esc((u.name || "U")[0]).toUpperCase()}</div>
          ${online ? `<span class="online-dot" style="width:14px;height:14px"></span>` : ""}
        </div>
        <div>
          <h2 class="font-display text-3xl font-bold">${esc(u.name || "User")}</h2>
          <p class="text-sm" style="color:var(--muted)">${online ? "Online" : "Offline"} - ${esc(u.institution || "No institution")}</p>
        </div>
      </div>
      <div class="grid sm:grid-cols-2 gap-3 mb-6">
        <div class="gc p-3"><small style="color:var(--muted)">Email</small><div>${esc(u.email || "")}</div></div>
        <div class="gc p-3"><small style="color:var(--muted)">Age</small><div>${esc(u.age || "--")}</div></div>
        <div class="gc p-3 sm:col-span-2"><small style="color:var(--muted)">Address</small><div>${esc(u.address || "Not provided")}</div></div>
      </div>
      <h3 class="font-display font-bold mb-3">Skills</h3>
      <div class="flex flex-wrap gap-2 mb-6">${(u.skills || []).map(s => `<span class="skill-tag">${esc(s)}</span>`).join("") || `<p style="color:var(--muted)">No skills listed.</p>`}</div>
      <button class="btn-p w-full" onclick="openChatWith('${u.id}')"><i class="fa-solid fa-comments"></i> Start Chat</button>
    </section>`;
}

function renderEditProfile() {
  cleanupListeners();
  const p = S.profile || {};
  document.getElementById("app").innerHTML = `
    ${navBar("profile")}
    <main class="pt-24 pb-12 px-4 max-w-lg mx-auto view-in">
      <h1 class="font-display text-4xl font-bold mb-6">Edit Profile</h1>
      <form id="edit-form" class="gc p-6 space-y-4">
        <input class="fi" id="e-name" required value="${esc(p.name || "")}" placeholder="Name" />
        <div class="grid grid-cols-2 gap-3">
          <input class="fi" id="e-age" type="number" required min="13" max="120" value="${esc(p.age || "")}" placeholder="Age" />
          <input class="fi" id="e-inst" required value="${esc(p.institution || "")}" placeholder="Institution" />
        </div>
        <input class="fi" id="e-addr" required value="${esc(p.address || "")}" placeholder="Address" />
        <input class="fi" id="e-skill-input" placeholder="Type skill and press Enter" />
        <div id="e-skills" class="flex flex-wrap gap-2"></div>
        <button class="btn-p w-full" id="e-btn">Save Changes</button>
      </form>
    </main>`;

  let skills = [...(p.skills || [])];
  const holder = document.getElementById("e-skills");
  const input = document.getElementById("e-skill-input");

  function draw() {
    holder.innerHTML = skills.map((s, i) => `<span class="skill-tag">${esc(s)} <button type="button" onclick="window._removeEditSkill(${i})">&times;</button></span>`).join("");
  }

  window._removeEditSkill = i => {
    skills.splice(i, 1);
    draw();
  };

  draw();

  input.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === ",") {
      e.preventDefault();
      const skill = input.value.replace(",", "").trim().toLowerCase();
      if (skill && !skills.includes(skill)) skills.push(skill);
      input.value = "";
      draw();
    }
  });

  document.getElementById("edit-form").addEventListener("submit", async e => {
    e.preventDefault();
    const data = {
      name: document.getElementById("e-name").value.trim(),
      age: parseInt(document.getElementById("e-age").value, 10),
      institution: document.getElementById("e-inst").value.trim(),
      address: document.getElementById("e-addr").value.trim(),
      skills
    };
    try {
      await db.collection("users").doc(S.user.uid).update(data);
      S.profile = { ...S.profile, ...data };
      toast("Profile updated", "success");
      go("dashboard");
    } catch (err) {
      toast(err.message, "error");
    }
  });
}

async function openChatWith(otherId) {
  const otherDoc = await db.collection("users").doc(otherId).get();
  if (!otherDoc.exists) {
    toast("User not found", "error");
    return;
  }

  const other = otherDoc.data();
  const convId = getConvId(S.user.uid, otherId);
  const ref = db.collection("conversations").doc(convId);
  const snap = await ref.get();

  if (!snap.exists) {
    await ref.set({
      participants: [S.user.uid, otherId],
      participantNames: {
        [S.user.uid]: S.profile?.name || "User",
        [otherId]: other.name || "User"
      },
      lastMessage: "",
      lastMessageTime: firebase.firestore.FieldValue.serverTimestamp(),
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
  }

  go("chat:" + convId + ":" + otherId);
}

function renderChat(convId = "", otherId = "") {
  cleanupListeners();
  document.getElementById("app").innerHTML = `
    ${navBar("chat")}
    <main class="pt-16 h-screen flex chat-layout view-in">
      <aside class="chat-side w-80 shrink-0 flex flex-col" style="border-right:1px solid var(--border)">
        <div class="p-4 border-b border-white/10"><h3 class="font-display font-bold">Conversations</h3></div>
        <div id="conv-list" class="flex-1 overflow-y-auto p-2"><div class="spinner"></div></div>
      </aside>
      <section class="flex-1 flex flex-col min-w-0">
        <header class="p-4 flex items-center gap-3 border-b border-white/10">
          <div id="chat-avatar" class="w-10 h-10 rounded-full bg-gradient-to-br from-brand-500 to-teal-600 flex items-center justify-center font-bold">?</div>
          <div>
            <div id="chat-name" class="font-bold">Select a conversation</div>
            <span class="status-badge"><i class="fa-solid fa-message"></i> Direct messages</span>
          </div>
        </header>
        <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-3 flex flex-col">
          <div class="flex-1 flex items-center justify-center"><p style="color:var(--muted)">Select a conversation to start chatting.</p></div>
        </div>
        <div id="chat-input-area" class="p-4 border-t border-white/10 hidden">
          <form id="msg-form" class="flex gap-2">
            <input class="fi flex-1" id="msg-input" autocomplete="off" placeholder="Type a message..." />
            <button class="btn-p px-4"><i class="fa-solid fa-paper-plane"></i></button>
          </form>
        </div>
      </section>
    </main>`;

  loadConversations(convId, otherId);
}

function loadConversations(activeConvId, activeOtherId) {
  db.collection("conversations")
    .where("participants", "array-contains", S.user.uid)
    .onSnapshot(async snap => {
      const convs = [];
      snap.forEach(d => convs.push({ id: d.id, ...d.data() }));

      convs.sort((a, b) => {
        const at = a.lastMessageTime?.toMillis?.() || 0;
        const bt = b.lastMessageTime?.toMillis?.() || 0;
        return bt - at;
      });

      const usersSnap = await db.collection("users").get();
      const users = [];
      usersSnap.forEach(d => {
        if (d.id !== S.user.uid) users.push({ id: d.id, ...d.data() });
      });

      const box = document.getElementById("conv-list");
      if (!box) return;

      let html = "";

      if (convs.length) {
        html += `<div class="px-2 pb-1 text-xs" style="color:var(--muted)">Chats</div>`;
        html += convs.map(c => {
          const otherUid = c.participants.find(p => p !== S.user.uid);
          const otherName = c.participantNames?.[otherUid] || "User";
          return `
            <button class="w-full text-left p-3 rounded-lg ${c.id === activeConvId ? "bg-brand-500/20" : "hover:bg-white/5"}"
              onclick="selectConversation('${c.id}','${otherUid}')">
              <div class="font-bold text-sm">${esc(otherName)}</div>
              <div class="text-xs truncate" style="color:var(--muted)">${esc(c.lastMessage || "No messages")}</div>
            </button>`;
        }).join("");
      }

      if (users.length) {
        html += `<div class="px-2 pt-3 pb-1 text-xs" style="color:var(--muted)">All Users</div>`;
        html += users.map(u => `
          <button class="w-full text-left p-3 rounded-lg hover:bg-white/5" onclick="openChatWith('${u.id}')">
            <div class="font-bold text-sm">${esc(u.name || "User")}</div>
            <div class="text-xs truncate" style="color:var(--muted)">${esc((u.skills || []).join(", ") || "No skills")}</div>
          </button>`).join("");
      }

      box.innerHTML = html || `<p class="p-4 text-sm" style="color:var(--muted)">No users yet.</p>`;

      if (activeConvId && activeOtherId) selectConversation(activeConvId, activeOtherId);
    });
}

async function selectConversation(convId, otherId) {
  S.convId = convId;

  const convDoc = await db.collection("conversations").doc(convId).get();
  const conv = convDoc.data() || {};
  const otherName = conv.participantNames?.[otherId] || "User";

  document.getElementById("chat-name").textContent = otherName;
  document.getElementById("chat-avatar").textContent = (otherName[0] || "U").toUpperCase();
  document.getElementById("chat-input-area").classList.remove("hidden");

  cleanupListeners();

  const msgBox = document.getElementById("chat-messages");
  msgBox.innerHTML = "";

  S.chatUnsub = db.collection("conversations").doc(convId).collection("messages")
    .orderBy("timestamp", "asc")
    .onSnapshot(snap => {
      if (!msgBox) return;

      const parts = [];

      snap.forEach(doc => {
        const m = doc.data();
        const mine = m.senderId === S.user.uid;
        const ts = m.timestamp?.toMillis?.() || Date.now();
        const text = m.text || "";

        parts.push(`
          <div class="flex ${mine ? "justify-end" : "justify-start"}">
            <div class="chat-bub ${mine ? "chat-bub-s" : "chat-bub-r"}">
              ${esc(text)}
              <div class="text-[10px] mt-1 opacity-70">${new Date(ts).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}</div>
            </div>
          </div>`);
      });

      msgBox.innerHTML = parts.join("") || `<div class="flex-1 flex items-center justify-center"><p style="color:var(--muted)">No messages yet. Say hello.</p></div>`;
      msgBox.scrollTop = msgBox.scrollHeight;
    });

  const form = document.getElementById("msg-form");

  if (!form._bound) {
    form._bound = true;

    form.addEventListener("submit", async e => {
      e.preventDefault();

      const input = document.getElementById("msg-input");
      const text = input.value.trim();

      if (!text || !S.convId) return;

      input.value = "";

      try {
        await db.collection("conversations").doc(S.convId).collection("messages").add({
          senderId: S.user.uid,
          senderName: S.profile?.name || "User",
          text,
          timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });

        await db.collection("conversations").doc(S.convId).update({
          lastMessage: text,
          lastMessageTime: firebase.firestore.FieldValue.serverTimestamp()
        });
      } catch (err) {
        toast("Send failed: " + err.message, "error");
      }
    });
  }
}

async function handleRegister(e) {
  e.preventDefault();

  const btn = document.getElementById("r-btn");
  btn.disabled = true;
  btn.textContent = "Creating...";

  const name = document.getElementById("r-name").value.trim();
  const email = document.getElementById("r-email").value.trim();
  const pass = document.getElementById("r-pass").value;
  const age = parseInt(document.getElementById("r-age").value, 10);
  const institution = document.getElementById("r-inst").value.trim();
  const address = document.getElementById("r-addr").value.trim();
  const skills = window._regSkills();

  if (!name || !email || !pass || !age || !institution || !address) {
    toast("All fields are required", "error");
    btn.disabled = false;
    btn.textContent = "Create Account";
    return;
  }

  if (!skills.length) {
    toast("Add at least one skill", "error");
    btn.disabled = false;
    btn.textContent = "Create Account";
    return;
  }

  try {
    const cred = await auth.createUserWithEmailAndPassword(email, pass);
    await cred.user.updateProfile({ displayName: name });

    await db.collection("users").doc(cred.user.uid).set({
      name,
      email,
      age,
      institution,
      address,
      skills,
      lastSeen: Date.now(),
      createdAt: Date.now()
    });

    toast("Account created", "success");
  } catch (err) {
    toast(err.message, "error");
    btn.disabled = false;
    btn.textContent = "Create Account";
  }
}

async function handleLogin(e) {
  e.preventDefault();

  const btn = document.getElementById("l-btn");
  btn.disabled = true;
  btn.textContent = "Signing in...";

  try {
    await auth.signInWithEmailAndPassword(
      document.getElementById("l-email").value.trim(),
      document.getElementById("l-pass").value
    );
  } catch (err) {
    toast(err.message, "error");
    btn.disabled = false;
    btn.textContent = "Sign In";
  }
}

async function handleForgot() {
  const email = document.getElementById("l-email")?.value.trim();
  if (!email) {
    toast("Enter your email first", "error");
    return;
  }

  try {
    await auth.sendPasswordResetEmail(email);
    toast("Password reset email sent", "success");
  } catch (err) {
    toast(err.message, "error");
  }
}

async function handleLogout() {
  cleanupListeners();
  if (S.presenceInterval) clearInterval(S.presenceInterval);

  try {
    if (S.user) await db.collection("users").doc(S.user.uid).update({ lastSeen: Date.now() });
    await auth.signOut();
  } catch {}

  S.user = null;
  S.profile = null;
  go("landing");
}

function startPresence() {
  if (S.presenceInterval) clearInterval(S.presenceInterval);

  S.presenceInterval = setInterval(async () => {
    if (S.user) {
      try {
        await db.collection("users").doc(S.user.uid).update({ lastSeen: Date.now() });
      } catch {}
    }
  }, 30000);

  document.addEventListener("visibilitychange", async () => {
    if (S.user && document.visibilityState === "visible") {
      try {
        await db.collection("users").doc(S.user.uid).update({ lastSeen: Date.now() });
      } catch {}
    }
  });
}

function go(route) {
  const [view, ...params] = route.split(":");

  if (!S.user && !["landing", "login", "register"].includes(view)) {
    renderLanding();
    return;
  }

  if (view === "landing") renderLanding();
  else if (view === "login") renderLogin();
  else if (view === "register") renderRegister();
  else if (view === "dashboard") renderDashboard();
  else if (view === "explore") renderExplore();
  else if (view === "profile") renderUserProfile(params[0]);
  else if (view === "editprofile") renderEditProfile();
  else if (view === "chat") renderChat(params[0], params[1]);
  else renderLanding();
}

async function init() {
  try {
    firebase.initializeApp(fbConfig);
    db = firebase.firestore();
    auth = firebase.auth();
  } catch (err) {
    toast("Firebase init failed: " + err.message, "error");
    return;
  }

  auth.onAuthStateChanged(async user => {
    if (!user) {
      S.user = null;
      S.profile = null;
      cleanupListeners();
      renderLanding();
      return;
    }

    S.user = user;

    try {
      const doc = await db.collection("users").doc(user.uid).get();

      if (!doc.exists) {
        await auth.signOut();
        renderLanding();
        return;
      }

      S.profile = doc.data();

      await db.collection("users").doc(user.uid).update({ lastSeen: Date.now() });
      startPresence();
      go("dashboard");
    } catch (err) {
      console.error(err);
      toast("Failed to load profile: " + err.message, "error");
      renderLanding();
    }
  });
}

init();
</script>
