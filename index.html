<script>
/*
=============================================================================
  FIRESTORE SECURITY RULES — Copy to Firebase Console → Firestore → Rules
=============================================================================
rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    match /users/{userId} {
      allow read: if request.auth != null;
      allow write: if request.auth != null && request.auth.uid == userId;
    }
    match /conversations/{convId} {
      allow read: if request.auth != null && request.auth.uid in resource.data.participants;
      allow create: if request.auth != null && request.auth.uid in request.resource.data.participants;
      allow update: if request.auth != null && request.auth.uid in resource.data.participants;
      match /messages/{msgId} {
        allow read: if request.auth != null && request.auth.uid in get(/databases/$(database)/documents/conversations/$(convId)).data.participants;
        allow create: if request.auth != null && request.auth.uid == request.resource.data.senderId;
      }
    }
  }
}
=============================================================================
*/

// ── Crypto Module (ECDH P-256 + AES-256-GCM) ──
const Crypto = {
  async genKeyPair(){
    return await crypto.subtle.generateKey({name:'ECDH',namedCurve:'P-256'},true,['deriveKey']);
  },
  async exportPub(kp){ return await crypto.subtle.exportKey('jwk',kp.publicKey); },
  async importPub(jwk){ return await crypto.subtle.importKey('jwk',jwk,{name:'ECDH',namedCurve:'P-256'},true,[]); },
  async deriveAES(privKey,pubKey){
    return await crypto.subtle.deriveKey({name:'ECDH',public:pubKey},privKey,{name:'AES-GCM',length:256},true,['encrypt','decrypt']);
  },
  async encrypt(aesKey,plain){
    const iv=crypto.getRandomValues(new Uint8Array(12));
    const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},aesKey,new TextEncoder().encode(plain));
    return {ct:ab2b64(ct),iv:ab2b64(iv)};
  },
  async decrypt(aesKey,ctB64,ivB64){
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b642ab(ivB64)},aesKey,b642ab(ctB64));
    return new TextDecoder().decode(pt);
  }
};
function ab2b64(buf){const u=new Uint8Array(buf);let s='';for(let i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s);}
function b642ab(b64){const s=atob(b64);const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u.buffer;}

// ── KeyStore (IndexedDB) ──
const KS={
  db:null,
  async init(){
    return new Promise((res,rej)=>{
      const r=indexedDB.open('SkillMatesKeys',1);
      r.onupgradeneeded=e=>e.target.result.createObjectStore('keys');
      r.onsuccess=e=>{this.db=e.target.result;res();};
      r.onerror=e=>rej(e);
    });
  },
  async save(uid,kp){
    const jwk=await crypto.subtle.exportKey('jwk',kp.privateKey);
    this.db.transaction('keys','readwrite').objectStore('keys').put(jwk,uid);
  },
  async load(uid){
    return new Promise((res,rej)=>{
      const r=this.db.transaction('keys','readonly').objectStore('keys').get(uid);
      r.onsuccess=()=>res(r.result);r.onerror=e=>rej(e);
    });
  },
  async del(uid){this.db.transaction('keys','readwrite').objectStore('keys').delete(uid);}
};

// ── App State ──

// ── Toast System ──
function toast(msg,type='info'){
  const c=document.getElementById('toast-container');
  const icons={success:'fa-circle-check',error:'fa-circle-xmark',info:'fa-circle-info'};
  const d=document.createElement('div');
  d.className=`toast toast-${type}`;
  d.innerHTML=`<i class="fa-solid ${icons[type]||icons.info}"></i><span>${msg}</span>`;
  c.appendChild(d);
  setTimeout(()=>{d.classList.add('out');setTimeout(()=>d.remove(),300);},3500);

// ── Utility ──
function getConvId(a,b){return a<b?a+'_'+b:b+'_'+a;}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}

// ── Handshake Canvas Animation ──
let animRAF=null;
function startHandshake(canvas){
  const ctx=canvas.getContext('2d');
  let W,H;function resize(){W=canvas.width=canvas.offsetWidth;H=canvas.height=canvas.offsetHeight;}
  resize(); window.addEventListener('resize',resize);
  const t0=performance.now();
  const CYCLE=12000;

  function drawPerson(x,y,scale,color,walk,armUp,facingRight){
    ctx.save();
    ctx.translate(x,y);
    if(!facingRight)ctx.scale(-1,1);
    ctx.scale(scale,scale);
    const bob=Math.sin(walk*2)*3;
    const leg=Math.sin(walk)*22;

    ctx.fillStyle='rgba(0,0,0,0.12)';
    ctx.beginPath();ctx.ellipse(0,78,22,6,0,0,Math.PI*2);ctx.fill();

    ctx.strokeStyle='#2D2D4E';ctx.lineWidth=8;ctx.lineCap='round';
    ctx.save();ctx.translate(-8,38+bob);ctx.rotate(leg*Math.PI/180);
    ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,36);ctx.stroke();
    ctx.fillStyle='#1A1A2E';ctx.beginPath();ctx.roundRect(-6,31,13,8,3);ctx.fill();ctx.restore();
    ctx.save();ctx.translate(8,38+bob);ctx.rotate(-leg*Math.PI/180);
    ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,36);ctx.stroke();
    ctx.fillStyle='#1A1A2E';ctx.beginPath();ctx.roundRect(-6,31,13,8,3);ctx.fill();ctx.restore();

    ctx.fillStyle=darken(color,.65);ctx.beginPath();ctx.roundRect(-24,-6+bob,11,32,5);ctx.fill();
    ctx.fillStyle=darken(color,.55);ctx.beginPath();ctx.roundRect(-23,8+bob,9,6,2);ctx.fill();

    ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(-19,-16+bob,38,55,12);ctx.fill();
    ctx.fillStyle=darken(color,.85);ctx.beginPath();ctx.moveTo(-8,-16+bob);ctx.lineTo(0,-8+bob);ctx.lineTo(8,-16+bob);ctx.fill();

    ctx.strokeStyle='#E8B88A';ctx.lineWidth=7;ctx.lineCap='round';
    const backArmAngle=(-armUp-leg*.4)*Math.PI/180;
    const frontArmAngle=(armUp+leg*.4)*Math.PI/180;
    ctx.save();ctx.translate(-17,-4+bob);ctx.rotate(backArmAngle);
    ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,32);ctx.stroke();ctx.restore();
    ctx.save();ctx.translate(17,-4+bob);ctx.rotate(frontArmAngle);
    ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,32);ctx.stroke();
    ctx.fillStyle='#E8B88A';ctx.beginPath();ctx.arc(0,34,5.5,0,Math.PI*2);ctx.fill();ctx.restore();

    ctx.fillStyle='#E8B88A';ctx.beginPath();ctx.roundRect(-6,-23+bob,12,10,4);ctx.fill();
    ctx.fillStyle='#E8B88A';ctx.beginPath();ctx.arc(0,-36+bob,19,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=darken(color,.55);
    ctx.beginPath();ctx.arc(0,-41+bob,19,Math.PI,0);ctx.fill();
    ctx.beginPath();ctx.roundRect(-21,-43+bob,42,8,4);ctx.fill();
    ctx.fillStyle=darken(color,.45);ctx.beginPath();ctx.roundRect(-6,-37+bob,28,5,2);ctx.fill();
    ctx.fillStyle='#2D2D4E';
    ctx.beginPath();ctx.arc(-7,-36+bob,2.8,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(7,-36+bob,2.8,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(-6,-37+bob,1,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(8,-37+bob,1,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#C4846A';ctx.lineWidth=1.8;
    ctx.beginPath();ctx.arc(0,-32+bob,7,.15*Math.PI,.85*Math.PI);ctx.stroke();

    ctx.restore();
  }

  function darken(hex,f){
    const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
    return `rgb(${Math.round(r*f)},${Math.round(g*f)},${Math.round(b*f)})`;
  }

  let sparkles=[];
  function addSparkle(x,y){
    sparkles.push({x,y,vx:(Math.random()-.5)*3,vy:(Math.random()-.5)*3-1,life:1,size:Math.random()*3+1,color:Math.random()>.5?'#F97316':'#2DD4BF'});
  }

  function frame(now){
    const elapsed=(now-t0)%CYCLE;
    const p=elapsed/CYCLE;
    ctx.clearRect(0,0,W,H);

    const cx=W/2, cy=H/2+20;
    const startL=-W*0.15, startR=W*1.15;
    const endL=cx-50, endR=cx+50;

    let lx,ly,rx,ry,walk,armUp,shakeGlow=0;

    if(p<0.3){
      const t=p/0.3;
      const ease=t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
      lx=startL+(endL-startL)*ease;
      rx=startR+(endR-startR)*ease;
      ly=cy;ry=cy;walk=t*12;armUp=0;
    } else if(p<0.38){
      const t=(p-0.3)/0.08;
      lx=endL;rx=endR;ly=cy;ry=cy;walk=12*(1-t);armUp=t*20;
    } else if(p<0.55){
      const t=(p-0.38)/0.17;
      lx=endL;rx=endR;ly=cy;ry=cy;walk=0;
      armUp=20+Math.sin(t*Math.PI*6)*8;
      shakeGlow=Math.sin(t*Math.PI)*1;
      if(Math.random()<.3)addSparkle(cx,cy-10);
    } else if(p<0.92){
      lx=endL;rx=endR;ly=cy;ry=cy;walk=0;armUp=20;
      shakeGlow=.6+Math.sin((p-.55)*10)*.4;
    } else {
      const t=(p-0.92)/0.08;
      ctx.globalAlpha=1-t;
      lx=endL;rx=endR;ly=cy;ry=cy;walk=0;armUp=20;
    }

    if(shakeGlow>0){
      const grd=ctx.createRadialGradient(cx,cy-10,0,cx,cy-10,60+shakeGlow*30);
      grd.addColorStop(0,`rgba(249,115,22,${.15*shakeGlow})`);
      grd.addColorStop(0.5,`rgba(13,148,136,${.1*shakeGlow})`);
      grd.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=grd;ctx.beginPath();ctx.arc(cx,cy-10,90,0,Math.PI*2);ctx.fill();
    }

    sparkles=sparkles.filter(s=>s.life>0);
    sparkles.forEach(s=>{
      s.x+=s.vx;s.y+=s.vy;s.life-=.02;s.vy+=.05;
      ctx.globalAlpha=s.life*(ctx.globalAlpha||1);
      ctx.fillStyle=s.color;
      ctx.beginPath();ctx.arc(s.x,s.y,s.size,0,Math.PI*2);ctx.fill();
    });
    ctx.globalAlpha=1;

    const sc=Math.min(W/800,H/500,1.2);
    drawPerson(lx,ly,sc,'#F97316',walk,armUp,true);
    drawPerson(rx,ry,sc,'#0D9488',walk,armUp,false);

    animRAF=requestAnimationFrame(frame);
  }
  animRAF=requestAnimationFrame(frame);
}
function stopHandshake(){if(animRAF){cancelAnimationFrame(animRAF);animRAF=null;}}

  <div class="relative min-h-screen overflow-hidden">

    <div class="relative z-10 min-h-screen flex flex-col items-center justify-center px-4 text-center">
      <h1 class="font-display text-5xl sm:text-7xl font-bold mb-4 leading-tight">

      </h1>
      <p class="text-lg sm:text-xl mb-8 max-w-lg" style="color:var(--muted)">Connect with peers, discover skills, and grow together through real-time collaboration.</p>
      <div class="flex gap-4 mb-16">

      </div>
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 max-w-3xl w-full">
        ${[

async function openChatWith(otherId,otherName){
  const convId=getConvId(S.user.uid,otherId);
  const convRef=db.collection('conversations').doc(convId);
  const convDoc=await convRef.get();

  if(!convDoc.exists){
    await convRef.set({
      participants:[S.user.uid,otherId],
      participantNames:{
        [S.user.uid]:S.profile?.name||'User',
        [otherId]:otherName
      },
      lastMessage:'',
      lastMessageTime:firebase.firestore.FieldValue.serverTimestamp(),
      createdAt:firebase.firestore.FieldValue.serverTimestamp()
    });
  }

  go('chat:'+convId+':'+otherId);
}

async function loadConversations(activeConvId, activeOtherId){
  db.collection('conversations')
    .where('participants','array-contains',S.user.uid)
    .orderBy('lastMessageTime','desc')
    .onSnapshot(async snap=>{

      const cl = document.getElementById('conv-list');
      if(!cl) return;

      const convs = [];
      snap.forEach(d=>convs.push({id:d.id,...d.data()}));

      let html = '';

      // ======================
      // 🟢 EXISTING CHATS
      // ======================
      if(convs.length){
        html += `<div style="font-size:12px;color:gray;margin-bottom:6px">Chats</div>`;

        html += convs.map(c=>{
          const otherUid = c.participants.find(p=>p!==S.user.uid);
          const otherName = c.participantNames?.[otherUid] || 'User';
          const active = c.id === activeConvId;

          return `
          <div class="p-3 rounded-lg cursor-pointer flex justify-between items-center ${active?'bg-brand-500/20':'hover:bg-white/5'}"
               onclick="selectConversation('${c.id}','${otherUid}')">

            <div>
              <div class="font-semibold text-sm">${esc(otherName)}</div>
              <div class="text-xs" style="color:var(--muted)">
                ${esc(c.lastMessage || 'No messages')}
              </div>
            </div>

          </div>`;
        }).join('');
      }

      // ======================
      // 🟣 ALL USERS (LIKE CONTACTS)
      // ======================
      const usersSnap = await db.collection('users').get();

      const users = [];
      usersSnap.forEach(d=>{
        if(d.id !== S.user.uid){
          users.push({id:d.id,...d.data()});
        }
      });

      if(users.length){
        html += `<div style="font-size:12px;color:gray;margin-top:10px">All Users</div>`;

        html += users.map(u=>`
          <div class="p-3 cursor-pointer hover:bg-white/5 flex justify-between items-center"
               onclick="openChatWith('${u.id}','${u.name || 'User'}')">

            <div>
              <div class="font-semibold text-sm">${esc(u.name || 'User')}</div>
              <div class="text-xs">${(u.skills||[]).join(', ')}</div>
            </div>

          </div>
        `).join('');
      }

      cl.innerHTML = html;

      // open active chat
      if(activeConvId){
        await selectConversation(activeConvId, activeOtherId);
      }
  });
}

async function selectConversation(convId,otherId){
  S.convId=convId;
  try{
    const cd=await db.collection('conversations').doc(convId).get();
    if(cd.exists){
      const d=cd.data();
      const oname=d.participantNames?.[otherId]||'User';
      const cn=document.getElementById('chat-name');if(cn)cn.textContent=oname;
      const ca=document.getElementById('chat-avatar');if(ca)ca.textContent=(oname[0]||'U').toUpperCase();
    }
  }catch(e){}
  const cia=document.getElementById('chat-input-area');if(cia)cia.style.display='block';

  try{
    const otherDoc=await db.collection('users').doc(otherId).get();
    if(!otherDoc.exists){toast('User not found','error');return;}
    const otherPubJwk=otherDoc.data().publicKey;
    if(!otherPubJwk){toast('Cannot establish encryption: user has no public key','error');return;}
    const otherPubKey=await Crypto.importPub(otherPubJwk);
    S.chatKey=await Crypto.deriveAES(S.keyPair.privateKey,otherPubKey);
  }catch(e){toast('Encryption setup failed: '+e.message,'error');return;}

  if(S.chatUnsub)S.chatUnsub();
  const msgDiv=document.getElementById('chat-messages');
  if(msgDiv)msgDiv.innerHTML='';
  S.chatUnsub=db.collection('conversations').doc(convId).collection('messages').orderBy('timestamp','asc').onSnapshot(async snap=>{
    if(!msgDiv)return;
    const wasAtBottom=msgDiv.scrollHeight-msgDiv.scrollTop-msgDiv.clientHeight<60;
    msgDiv.innerHTML='';
    let lastDate='';
    snap.forEach(async d=>{
      const m=d.data();
      const ts=m.timestamp?.toMillis?.()||m.timestamp||Date.now();
      const date=new Date(ts).toLocaleDateString();
      if(date!==lastDate){lastDate=date;msgDiv.innerHTML+=`<div class="text-center text-xs py-2" style="color:var(--muted)">${date}</div>`;}
      const isMine=m.senderId===S.user.uid;
      let text='[Failed to decrypt]';
      try{text=await Crypto.decrypt(S.chatKey,m.ciphertext,m.iv);}catch(e){text='[Decryption error]';}
      msgDiv.innerHTML+=`<div class="flex ${isMine?'justify-end':'justify-start'}"><div class="chat-bub ${isMine?'chat-bub-s':'chat-bub-r'}">${esc(text)}<div class="text-[10px] mt-1 ${isMine?'text-white/60':''}" style="${isMine?'':'color:var(--muted)'}">${new Date(ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div></div></div>`;
    });
    if(wasAtBottom)msgDiv.scrollTop=msgDiv.scrollHeight;
    if(snap.empty)msgDiv.innerHTML='<div class="flex-1 flex items-center justify-center"><p class="text-sm" style="color:var(--muted)">No messages yet. Say hello!</p></div>';
  });

  const form=document.getElementById('msg-form');
  if(!form||form._bound)return;form._bound=true;
  form.addEventListener('submit',async e=>{
    e.preventDefault();
    const inp=document.getElementById('msg-input');
    const text=inp.value.trim();
    if(!text||!S.chatKey)return;
    inp.value='';
    try{
      const {ct,iv}=await Crypto.encrypt(S.chatKey,text);
      await db.collection('conversations').doc(convId).collection('messages').add({
        senderId:S.user.uid,ciphertext:ct,iv:iv,
        timestamp:firebase.firestore.FieldValue.serverTimestamp()
      });
      await db.collection('conversations').doc(convId).update({
        lastMessage:text,lastMessageTime:firebase.firestore.FieldValue.serverTimestamp()
      });
    }catch(err){toast('Send failed: '+err.message,'error');}
  });
}

function renderChatList(){
  S.view='chat';stopHandshake();cleanupListeners();
  const app=document.getElementById('app');
  app.innerHTML=`${navBar('chat')}
  <main class="pt-24 pb-12 px-4 max-w-2xl mx-auto view-in">
    <h1 class="font-display text-3xl font-bold mb-2">Messages</h1>
    <p class="mb-6" style="color:var(--muted)">Your end-to-end encrypted conversations</p>
    <div id="chatlist" class="space-y-2"><div class="flex items-center justify-center py-12"><div class="spinner"></div></div></div>
  </main>`;
  db.collection('conversations').where('participants','array-contains',S.user.uid).orderBy('lastMessageTime','desc').onSnapshot(snap=>{
    const convs=[];
    snap.forEach(d=>convs.push({id:d.id,...d.data()}));
    const cl=document.getElementById('chatlist');
    if(!cl)return;
    if(!convs.length){cl.innerHTML='<div class="gc p-8 text-center"><i class="fa-solid fa-comments text-3xl mb-3" style="color:var(--muted)"></i><p style="color:var(--muted)">No conversations yet. Explore users and start a chat!</p><button class="btn-s mt-4" onclick="go(\'explore\')">Find People</button></div>';return;}
    cl.innerHTML=convs.map(c=>{
      const otherUid=c.participants.find(p=>p!==S.user.uid);
      const otherName=c.participantNames?.[otherUid]||'User';
      return `<div class="gc p-4 flex items-center gap-3 cursor-pointer hover:border-brand-500/30" onclick="go('chat:${c.id}:${otherUid}')">
        <div class="w-11 h-11 rounded-full bg-gradient-to-br from-brand-500 to-teal-600 flex items-center justify-center text-white font-bold shrink-0">${esc((otherName[0])||'U').toUpperCase()}</div>
        <div class="min-w-0 flex-1"><div class="font-semibold text-sm">${esc(otherName)}</div><div class="text-xs truncate" style="color:var(--muted)">${esc(c.lastMessage||'No messages')}</div></div>
        <div class="enc-badge shrink-0"><i class="fa-solid fa-lock text-[9px]"></i></div>
      </div>`;
    }).join('');
  });
}

// ── Firebase Handlers ──
async function handleRegister(e){
  e.preventDefault();
  const btn=document.getElementById('r-btn');btn.disabled=true;btn.textContent='Creating...';
  const name=document.getElementById('r-name').value.trim();
  const email=document.getElementById('r-email').value.trim();
  const pass=document.getElementById('r-pass').value;
  const age=parseInt(document.getElementById('r-age').value);
  const inst=document.getElementById('r-inst').value.trim();
  const addr=document.getElementById('r-addr').value.trim();
  const skills=window._regSkills();
  if(!name||!email||!pass||!age||!inst||!addr){toast('All fields are required','error');btn.disabled=false;btn.textContent='Create Account';return;}
  if(skills.length===0){toast('Add at least one skill','error');btn.disabled=false;btn.textContent='Create Account';return;}
  try{
    const cred=await auth.createUserWithEmailAndPassword(email,pass);
    await cred.user.updateProfile({displayName:name});
    const kp=await Crypto.genKeyPair();
    const pubJwk=await Crypto.exportPub(kp);
    await db.collection('users').doc(cred.user.uid).set({
      name,email,age,institution:inst,address:addr,skills,
      publicKey:pubJwk,lastSeen:Date.now(),createdAt:Date.now()
    });
    await KS.save(cred.user.uid,kp);
    S.keyPair=kp;
    toast('Account created successfully!','success');
  }catch(err){toast(err.message,'error');btn.disabled=false;btn.textContent='Create Account';}
}

async function handleLogin(e){
  e.preventDefault();
  const btn=document.getElementById('l-btn');btn.disabled=true;btn.textContent='Signing in...';
  try{
    await auth.signInWithEmailAndPassword(document.getElementById('l-email').value.trim(),document.getElementById('l-pass').value);
  }catch(err){toast(err.message,'error');btn.disabled=false;btn.textContent='Sign In';}
}

async function handleForgot(){
  const email=document.getElementById('l-email')?.value?.trim();
  if(!email){toast('Enter your email first','error');return;}
  try{await auth.sendPasswordResetEmail(email);toast('Password reset email sent!','success');}catch(err){toast(err.message,'error');}
}

async function handleLogout(){
  cleanupListeners();
  if(S.presenceInterval)clearInterval(S.presenceInterval);
  try{
    if(S.user)await db.collection('users').doc(S.user.uid).update({lastSeen:Date.now()});
    await auth.signOut();
  }catch(e){}
  S.user=null;S.profile=null;S.keyPair=null;
  go('landing');
}

function cleanupListeners(){
  if(S.chatUnsub){S.chatUnsub();S.chatUnsub=null;}
  if(S.usersUnsub){S.usersUnsub();S.usersUnsub=null;}
}

// ── Router ──
function go(route){
  if(S.chatUnsub){S.chatUnsub();S.chatUnsub=null;}
  stopHandshake();
  if(!S.user && !['landing','login','register'].includes(route.split(':')[0])){go('landing');return;}
  const [view,...params]=route.split(':');
  switch(view){
    case 'landing':renderLanding();break;
    case 'login':renderLogin();break;
    case 'register':renderRegister();break;
    case 'dashboard':renderDashboard();break;
    case 'explore':renderExplore();break;
    case 'profile':renderUserProfile(params[0]);break;
    case 'editprofile':renderEditProfile();break;
    case 'chat':
      if(params[0]&&params[1])renderChat(params[0],params[1]);
      else renderChatList();
      break;
    default:go('landing');
  }
}

// ── Presence System ──
function startPresence(){
  if(S.presenceInterval)clearInterval(S.presenceInterval);
  S.presenceInterval=setInterval(async()=>{
    if(S.user)try{await db.collection('users').doc(S.user.uid).update({lastSeen:Date.now()});}catch(e){}
  },30000);
  document.addEventListener('visibilitychange',async()=>{
    if(S.user&&document.visibilityState==='visible')try{await db.collection('users').doc(S.user.uid).update({lastSeen:Date.now()});}catch(e){}
  });
  window.addEventListener('beforeunload',()=>{
    if(S.user)try{db.collection('users').doc(S.user.uid).update({lastSeen:Date.now()});}catch(e){}
  });
}

// ── Initialization ──
async function init(){
  if(!crypto||!crypto.subtle){
    document.getElementById('app').innerHTML='<div class="min-h-screen flex items-center justify-center p-4"><div class="gc p-8 text-center max-w-md"><i class="fa-solid fa-triangle-exclamation text-4xl text-brand-400 mb-4"></i><h2 class="font-display text-2xl font-bold mb-2">Secure Context Required</h2><p style="color:var(--muted)">This app uses the Web Crypto API for end-to-end encryption. Please access it via HTTPS or localhost.</p></div></div>';
    return;
  }

  try{await KS.init();}catch(e){console.warn('IndexedDB unavailable, keys will be session-only');}

  // Initialize Firebase with hardcoded config
  try{
    firebase.initializeApp(fbConfig);
    db=firebase.firestore();
    auth=firebase.auth();
  }catch(e){
    toast('Firebase init failed: '+e.message,'error');
    return;
  }

  auth.onAuthStateChanged(async user=>{
    if(user){
      S.user=user;
      try{
        const doc=await db.collection('users').doc(user.uid).get();
        if(doc.exists){
          S.profile=doc.data();
          let savedPriv=await KS.load(user.uid);
          if(savedPriv){
            const privKey=await crypto.subtle.importKey('jwk',savedPriv,{name:'ECDH',namedCurve:'P-256'},true,['deriveKey']);
            const pubKey=await crypto.subtle.importKey('jwk',S.profile.publicKey,{name:'ECDH',namedCurve:'P-256'},true,[]);
            S.keyPair={privateKey:privKey,publicKey:pubKey};
          }else{
            const kp=await Crypto.genKeyPair();
            const pubJwk=await Crypto.exportPub(kp);
            await db.collection('users').doc(user.uid).update({publicKey:pubJwk});
            await KS.save(user.uid,kp);
            S.keyPair=kp;
          }
          await db.collection('users').doc(user.uid).update({lastSeen:Date.now()});
          startPresence();
          go('dashboard');
        }else{
          await auth.signOut();
          go('landing');
        }
      }catch(err){
        console.error(err);
        toast('Failed to load profile: '+err.message,'error');
        go('landing');
      }
    }else{
      S.user=null;S.profile=null;S.keyPair=null;
      cleanupListeners();
      if(S.presenceInterval)clearInterval(S.presenceInterval);
      go('landing');
    }
  });
}

init();
</script>
